<template id="intro-tpl">
  <article class="intro">
    <div class="prose">
      <blockquote><p>What stories do you think of when you hear the words "Vishnu hadouken"? What important works of fiction come to mind? Pop culture? Classic literature? TV and film? Traditional myth? Non-English culture? Aim to be exhaustive, but also tell me a bit about each story and how it incorporates the idea. Write at length.</p></blockquote>
      <p>This was the prompt I gave to Claude Opus 4.7 back in April, as part of trying to win the <a href="https://www.hyperstitionai.com/unslop">Unslop Prize</a> for AI-generated fiction. The choice of seed words ("Vishnu hadouken") was specific to a particular story, but the rest was part of a pipeline intended to generate reasonably good AI fiction without any human involvement.</p>
      <p>I tried a bunch of different things, for that initial part of the pipeline and beyond, mostly to no avail. I ended up losing the contest.</p>
      <p>Still, I felt like the piece that started with "Vishnu hadouken", which I ultimately submitted had — unlike basically every other piece I had the AI cook up — a bit of <em>soul</em>. There was a good story, underneath the slop. It even made me choke up and cry a little, as I was reading it for the first time.</p>
      <p>Sure, it was still <em>bad</em>… but… maybe…</p>
      <p>A couple months later, feeling inspired, I dusted it off. Editing heavily and rewriting the ending, I eventually had something that passed as “100% Human” on Pangram. <a href="https://raelifin.substack.com/p/the-keepers-dharma">I published the result</a>, which several people have told me they liked a lot.</p>
      <p>Did I pass off an AI story as my own? Or was my work transformative? Maybe you should decide!</p>
      <p>The whole process taught me some things about "Quality" and the aspects of good writing that are still somewhat elusive for LLMs. Thus, I decided to put up this site, and provide a passage-by-passage breakdown of the story, and notes on how things changed. Consider it to be a kind of "director's commentary."</p>

<script type="text/plain" id="story-source">
===
[claude]
By nine o'clock on Thursday morning Pemberton had already signed Sir Reginald's name six times, in six different hands. The first signature of the day was always the shakiest — a deliberate tremor in the R, consistent with a man of ninety-four signing the monthly Direct Debit Authorization over his first cup of tea. By the sixth signature, for the Charitable Trust Disbursement to the village of Palasagar in the Satpura foothills, the hand had steadied, as was right: Sir Reginald, were he alive, would have been a better man by nine than he had been at seven. Pemberton had kept extensive notes on this through the nineteen-sixties and early seventies and considered the record authoritative. His own signature, by contrast, had gone to pieces in the manner of old men's — the P a snail, the final n a fishhook — while the master's remained a forty-four-year-old's, which it had been on the night Pemberton had learned it by heart.
[max]
By nine o’clock on Thursday morning, Pemberton had already signed Sir Reginald’s name six times, in six different hands. The first of the day was always the shakiest—a deliberate tremor in the R, consistent with a man of eighty-five signing the monthly Direct Debit Authorization over his first cup of tea. By the sixth signature, for the Charitable Trust Disbursement to the village of Palasagar in the Satpura foothills, the hand had steadied, as was right. Sir Reginald, were he alive, would have been a better man by nine than he had been at seven. Over the long decades, Pemberton’s own signature had withered into a caricature—the P a snail, the final n a fishhook. But the master’s remained, in broad strokes, the same as the thirty-five-year-old’s had been, when Pemberton learned it by heart.
[notes]
I think this is a banger of an opening! Good job, Claude!

We are introduced to Pemberton, a forger who is signing many things as "Sir Reginald." We're showing many things, rather than telling the reader outright. Pemberton is British, an early-riser, and has a penchant for detail. Sir Reginald is associated with a philanthropic effort in India. Pemberton and Sir Reginald were familiar in some way, many decades ago.

I think my tweaks are pretty minimal, all things considered. I eventually changed the age/chronology for reasons I'll discuss later. For a more literary feel, I tightened up the spaces around the em-dashes (which I mostly kept because em-dashes are cool; fuck the haters), made the quotes curly (because they're easier to read that way), and flattened a colon into a full-stop to make things more plain. (The changes to the quotes and the spacing around the em-dashes is so pervasive that this website doesn't bother rendering those diffs on the Edits tab.)

More substantially, I cut a sentence which belabors Pemberton's attention to detail, age, and mentions note-taking. The cut is partly just to get rid of unnecessary words, but also because, uh, Pemberton is committing a crime, and [taking notes](https://www.reddit.com/r/television/comments/ajsf7e/the_wire_stringer_bell_on_taking_notes/). Also, he supposedly "learned [forging the signature] by heart" one night (which turns out to be implausible and unnecessary), so, uh, why did he keep "extensive notes"?? Claude is subtly depicting a strong degree of incompetence (mixed with competence), that is dissonant and hurts the characterization.

We're finally treated to a lovely bit of prose contrasting the signatures. Because there's a lot happening in the paragraph, I tried to make things easier to follow by exchanging "gone to pieces in the manner of old men's" (not old women's?) with "withered into a caricature". The run-on-sentence was cute, but a bit too much for paragraph one.
===
[claude]
The ink was a difficulty. He used the same iron-gall he had always used — Diamine, from a stationer in Tonbridge who had not, in recent years, known he was still alive — and the ink, new in the bottle, was a blue so dark it looked black. By the second or third month in the house it began to rust. By six months it was frankly orange. He had topped the bottle up five times in five decades and five times the blue had gone out of it within a season, as if the house itself were converting it. He had come, over the years, to find this acceptable. Sir Reginald's later correspondence would, if closely examined, show a consistent drift toward warmer pigments over the course of any given year. This was plausible. Old men were entitled to drift.
[max]
The ink was a difficulty. Sourced from a stationer in Tonbridge nearly as old as Pemberton, the Diamine didn’t get as much use these days. Correspondences slowed down, or simply ended, without replacement. New in the bottle, the iron-gall was a blue so dark it looked black. But by the third month it began to rust. By nine months it was, frankly, orange. One could forgive Sir Reginald Ashworth-Blake for drifting towards warmer pigments over the course of the year. Old gentlemen were entitled to drift. But there were limits.
[notes]
Em-dashes are good, but we just treated ourself in the last paragraph. Time to tighten things up! The voice, more generally, is fun and eccentric, but one must be careful not to overdo it.

Whenever words can get cut without altering the overall feel, I want to cut them. "He had come, over the years, to find this acceptable." and "This was plasuible." are particularly awful sentences, and very LLM-ish. They say nothing new and merely hit us over the head with banal imagery.

Same with "He had topped the bottle up five times in five decades and five times the blue had gone out of it within a season, as if the house itself were converting it." Saying "five" three times in fast succession is the sort of move that draws the reader to notice the prose, rather than sink into the mood. The "as if the house itself were converting it" phrase evokes a kind of magical mood that matches some of what comes later, but is too heavy for the content. If there's a magic spell on the house, it's too blunt/clumsy to say "as if the house...", and if there's no spell on the house, why the hell are you spotlighting the interaction so heavily?

I thought the notion that the ink rusts in "a season" and then only gets changed once a decade was a bit much. Pemberton is a housekeeper, and he's just, uh, writing with orange-rusted ink all the time? Incompetent!

I added a bit about correspondences slowing down to help clarify why the ink is rusting instead of getting used up. It reveals Pemberton to be a man who is stuck in his ways, instead of adapting as he ages, and dispells the notion of some sort of magic ink-rusting spell.

"But there were limits." is my attempt to segue. It's the sort of sentence that you have to be careful not to overuse, and that LLMs love to hammer, but I think it earns its keep here. It's nominally about replacing the ink, but it tees up the reader to expect the story to center on the limits that are placed on old gentlemen. A better writer might've been able to find a segue that works equally well while being less blunt.
===
[claude]
He blotted the sixth signature, capped the fountain pen, and returned it to the japanned case in which it had lived, undisturbed, since its owner's death. The pen was a Conway Stewart, with which Sir Reginald had written three unpublished novels, the best of them called *A Warm Country,* the worst *Under Crocus,* and the middle one so indifferent Pemberton had, through an act of involuntary kindness, forgotten its title. He dusted the case with the edge of his sleeve and replaced it in the left-hand drawer of the master's desk, which also contained a small stack of blue airmail letters from Palasagar, a photograph he had looked at many times, a list in Pemberton's own hand of the things he intended one day to do about them, and, beneath the list, a letter dated 1971 from a Dr. Wigram of Harley Street, underlined twice in pencil by its recipient, concerning the wall of his aorta and the wall of his father's aorta and the statistical relationship between the two.
[max]
Pemberton made a quick note in his planner to visit Tonbridge on Saturday, capped the fountain pen, and returned it to the japanned case where it had lived, without exception, since its owner’s death. The pen was a Conway Stewart, with which Sir Reginald had written three unpublished novels, the best of them called *A Warm Country,* the worst *Under Crocus,* and the middle one so indifferent Pemberton had, through an act of involuntary kindness, forgotten its title. He dusted the case with the edge of his sleeve and replaced it in the left-hand drawer of the master’s desk.

Pemberton paused, looking down into the drawer. A photograph lay there, beside the letter of warning from nineteen-sixty-three, embossed with the letterhead of Dr. Wigram of Harley Street, and the small stack of blue airmail letters that had been read many times, but had never been answered. He reached for the picture, muttered the last few words of a prayer, and tucked it into the envelope where it belonged.
[notes]
To keep momentum, we cap the micro-story about ink right as we literally cap the pen. I'm not sure why Claude thought it was better to return to the sixth signature.

I love the word "[japanned](https://en.wikipedia.org/wiki/Japanning)", which I learned from this story. It's a delightful little relic from a different age and culture.

The word "undisturbed" is a clear instance of a mistake. The fountain pen can't be "undisturbed" if it's regularly getting used!

Back to The Voice. In the strong middle of the paragraph, we continue to relish in Pemberton's (neuro-atypical?) affection for the innanimate. We also show his affection for Sir Reginald in the implication that Pemberton has read all of his late master's books (which also show a continued attention to India). Pemberton's attention to detail is subverted in his forgetting the title of the worst book. Despite leaning a little into telling by saying "an act of involuntary kindness", I think it earns its keep as a way to help carry the reader through a somewhat heavy passage.

But we need a break! It's too much! Pull back! Paragraph break!

I give a beat to the reader with a simple sentence, setting up the looking-into-the-drawer. What does Pemberton see? These moments of micro-[tension](https://raelifin.substack.com/p/tension) are important for keeping the reader engaged and humming along, instead of blocking out the prose and getting bored.

"A photograph lay there," but we don't see what's on the photo. What's on the photo?! Stay tuned to find out!

I could unpack the various weaknesses in Claude's version and talk about where I think mine does better, but let's close this passage by noting that my version ends with a beat of "a prayer." This turns out to be extremely important for the arc of the story, and it, alongside the return to the hinting at India serves as a promise to the reader that something interesting is coming.

[max]
It had taken all of Wednesday to arrange the drawing room just so, in preparation for the day’s events. Pemberton was crossing the hall to fetch *The Times* for authenticity—Sir Reginald, being a man of standing, had offered occasional commentary in life, particularly on the topic of the Kentish Weald, and thus the letters continued after death, as an occasional treat for the editors—when there came the brittle clatter of the doorbell.
[notes]
Our first paragraph where I added more than I cut!

Looking at my version, notice that I'm teeing up the action with bits of tension. He spent the whole of yesterday to prepare... for what? He needs *The Times* for... authenticity? I'm using the em-dashes to interrupt the action of the sentence with a characteristic bit of Pemberton, during which the reader is waiting to see where it lands.

By contrast, Claude's interjection is hardly an interruption. We could replace the first em-dash with a full stop and it'd be fine. The bits about the Palasagar disbursement and "the firm's partner" are, imo, too heavy right on the heels of a paragraph about India. We want the reader to set India down for the moment and let things stew while Pemberton goes about his day.

And then the doorbell! This is an excellent structural move on Claude's part. Doorbells are basically a free bit of tension and momentum in one simple object. (But also, give the sound character!)

[claude]
The postman had already been, so this was someone else. The bell rang a second time, and a third, with a particular precision, as if the caller had calculated the acoustic properties of the hallway and spaced his rings accordingly.

Pemberton opened the door.
[max]
This was bad. The solicitor, Mr. Morley, had never arrived before noon. Pemberton froze, newspaper in hand, and hoped it was a delivery. The bell rang a second time, after a polite silence, to indicate it was not.

Pemberton set down the paper, took a breath to steady himself, and opened the door.
[notes]
Claude writes "The postman had already been, so this was someone else." This is especially clumsy after the previous paragraph mentioning that Pemberton has the post in hand. And who cares if this is the postman or not? In fact, in the context of what comes later, there's an obvious guess as to who it is: the Life Assurance agent there for a scheduled appointment.

To write engaging, tense stories, it helps if the characters are engaged and tense. What is Pemberton feeling in this moment? He's a criminal who is about to be tested! He needs to feel nervous, or at the very least the reader needs to be amazed by how cool he's staying the in face of pressure.

In my version, I show Pemberton's panic by telling the reader that things are bad. (Why are things bad?!) Things are bad because the solicitor never arrives before noon! (Why is that bad?!)

As will be revealed in a moment, the character at the door is a benevolent god. Claude's version has an air of magical knowledge, but if you read it literally it makes the character ringing the doorbell seem impatient and rude. I tried to keep Claude's idea of subtly supernatural knowledge, but tie it to Pemberton's hesitance, showing two things at once.

And again, we can anchor the energy in Pemberton as he opens the door to keep things embodied and empathetic.

[claude]
On the step stood a gentleman of middle height, dressed in an immaculate three-piece charcoal suit, a silk tie of the deepest indigo, and polished Oxfords in which one could have inspected the state of one's collar. His complexion was the blue of the sea at evening before weather. He had four arms. Two emerged from his cuffs in the usual manner. Two others, equally well-dressed and equally well-groomed, emerged from a second set of cuffs set slightly higher along his jacket, which had clearly been tailored to accommodate them. In his upper-right hand he held a conch shell, and balanced upon the conch, in defiance of most of what Pemberton had been taught to expect of small objects on curved surfaces, a small engraved calling card. His other three hands held a spinning disc of fire that was for the moment tactfully not rotating, a silver mace, and a lotus blossom.
[max]
On the step stood an intense young gentleman of middle height, dark hair woven into an elaborate topknot. He wore a marigold tuxedo as though it were the most natural thing in the world, accented by a silk tie of the deepest crimson. His feet were bare. The skin of those feet was the same as that of his hands and face: blue as the open ocean. He had four arms. Two emerged from his cuffs in the usual manner. Two others, equally well-dressed, occupied a second set of sleeves, slightly higher and further back, no-doubt custom tailored. In his lower-right hand he pinched a large conch shell between thumb and forefinger. Balanced upon the conch, in defiance of most of what Pemberton had been taught to expect of small objects on curved surfaces, was an engraved calling card. In his other three hands were a golden scepter, etched with peacock feathers; a plate-sized ring of fire, slowly rotating; and the pink and white blossom of a lotus.
[notes]
Here the deity is revealed. Claude starts by describing an ordinary dude. Charcoal suit. Sure. Tie. Sure. Shiny shoes. Cool. "His complexion was the blue of the sea at evening before weather." Uh... what? "He had four arms." Bam! Extremely quick escalation.

This is *okay.* It means the start of the paragraph is flat, but you get more kick. Unlike many other changes, where I feel that I'm improving Claude's prose, here I think my version is simply different.

I go for a slower build. We start with *intense*, then build to a *topknot*, then build to *marigold tuxedo with crimson tie*, then builds again to *bare feet* (notice the interleaving of long and short sentences), and then builds AGAIN to *blue skin* (which I try to make more obvious than "complexion", which is perhaps a bit oblique). By the time we get to the four arms, it fits into a cascade of escalating wildness.

After tightening up the language around the sleeves, I move the conch shell from the upper hand to the lower hand. As I understand it, the arrangement of the divine emblems held by Vishnu are each associated with [a different manifestation of the deity](https://www.indica.today/quick-reads/24-names-of-vishnu/). Krishna, who I'll talk about in a bit, typically holds *Panchajanya*, the shell, in his lower-right hand.

Panchajanya is a great choice for the focus. Associated with beginnings and creation, the deity is using it to to hold a calling card to introduce himself in a way that straddles the uncanny valley between two cultures. The last bit of editing is just to clean up the description of the other emblems. For example, what does it mean for there to be "a spinning disc of fire that was for the moment tactfully not rotating" (you're trying too hard to be clever, Claude!). The mace, *Kaumodaki*, is supposed to be gold.

[claude]
Pemberton thought, with a clarity he had not experienced since the summer of 1962, *oh fuck.*
[max]
Pemberton thought, with a feeling he had not experienced so intensely since the sixties, *oh fuck.*
[notes]
This is a banger of a paragraph. It is *exactly* when to drop the f-bomb. We've gone from a normal story about a butler who's forging his late master's signature to a supernatural ride, and this is the moment where the floor drops out from underneath the protagonist, mirroring the reader's excitement.

Still, there are improvements to be made. I swapped "clarity" for "feeling", since we want to emphasize the depth of emotion, rather than the clarify of emotion. And I swapped the specific reference to 1962 to a more generic reference to the intensity of emotion of the sixties. Claude's version *distracts* the reader with the question about what happened in 1962. That's not where the energy of the scene is, and more importantly, it doesn't pay off later. My version, by contrast, shows that Pemberton used to have things happen, but has been living a life of quiet non-intensity for many decades. Readers understand that the sixties were wild, and some readers may wonder if there's a specific incident or set of incidents in mind, but the cliche of the wild sixties allows the focus to remain on the punchline that follows.

[claude]
Then he said, "Good morning, sir."

"Good morning," the gentleman said. "I am here from the Office of the Preserver. I have been asked to conduct a review of this household's dharmic account. The matter is routine, I assure you. I have an appointment."
[max]
Then he said, “Good morning, sir.”

“Good morning,” the gentleman said, with a voice that resonated with calm strength. “I am here from the Office of the Preserver. Late last year, I was tasked with conducting a review of this household’s dharmic account. I apologize for the delay.”
[notes]
Another excellent paragraph. We reveal Pemberton's character by showing that even when he's spiraling and face-to-face with a god, he is the model of a proper English gentleman.

Then we get to the god's response. I think Claude often drops the ball by being too muted, even when telling a story about something wild. It did this earlier with the charcoal suit and polished Oxfords, and it's doing it again with the simple good morning. This kind of blandness, I believe is a side-effect of the post-training that LLMs get to be calm and balanced personal assistants; the character of reasonable-centrist bleeds over into their fiction to make milequetoast stories about reasonable-centrists having calm chats about the nature of quietness or whatever.

Which doesn't mean that the god being calm and polite is wrong. I think it works well for The Preserver, but I add the "resonated calm strength" to add sensual texture and lean in to the superhuman aura, rather than letting it slide past like any other greeting.

I cut "I have been asked" because I don't think it makes sense. Who is asking this god to do this? Rather, I choose "I was tasked" as a way to reference the notion of *dharma* which is a central theme of the story.

"The matter is routine, I assure you. I have an appointment." is similarly bad. It's deflationary and also inconsistent with the rest of the story. If he had an appointment, it wouldn't be a surprise! And it's definitely *not* routine! Rather, I choose to make it a visit that is later than it should be, in some sense. The god's apology helps set up the relationship dynamics with Pemberton such that the audience, ideally, is caught in a double-vision where they can't tell whether the divine is ally or enemy to our protagonist.

[claude]
The gentleman lifted the calling card from the conch with a small motion of his lower-left hand and presented it. Pemberton took it, glanced at it — the lettering was in a script he did not read but somehow understood — and set it on the silver salver by the door.
[max]
The gentleman presented the calling card, still perched atop the conch. Pemberton glanced at it as he took it, verifying what his gut already knew: “Krishna, Senior Avatar of Vishnu, Office of the Preserver, 108 Vaikuntha Way.” The lettering was beautiful, flowing in a script he could not read but somehow still understood. He set it on the silver salver by the door.
[notes]
Before getting into the details of the prose, we should talk about the identity of the god. In Claude's version, the god is revealed to be Vishnu, the Hindu god of protection, but is not named as such until an off-hand paragraph much later. Readers who are already familiar with Hinduism will recognize Vishnu from the emblems he holds: the conch, disk of fire, mace, and lotus. But it's clear that the target audience of this story is not expected to be familiar with that imagery, and we want to help them out. This moment of introduction is the perfect opportunity, and in Claude's version it creates distance between Pemberton and the audience by having Pemberton glance at the card and move along without it even really registerring. Very weak.

I, however, decided to go further, changing Vishnu to Krishna. And unfortunately, I can't expand upon this choice without, uh, taking some theological stances that might make various sectarian Hindus upset. Sorry, sectarian Hindus! I'm a know-nothing westerner who writes about your culture because I'm a xenophile, and if you're angry, that's probably justified. Emails are welcome.

Anyway, the basic deal is that Vishnu is one of "the big three" gods, alongside Brahma and Shiva, and has been incarnated in many avatars over the years, including Krishna. But where many of these avatars are something like flimsy shells around Vishnu as a character, Krishna is *purna* — a complete person who holds a special significance beyond merely being a manifestation of Vishnu. At the risk of pissing even more people off, I think of Krishna a bit like Jesus and Vishnu as a bit like Yaweh ("the father") in Catholicism. They are both "the same god", but also Krishna has become the central deity in many households thanks to his human-scale stories and character, in contrast to the cosmic, transcendent Vishnu.

Because this is a small-stakes story about a particular human life, where the avatar is something of a trickster, I decided that it works better with Krishna in particular. I'll reference the god as "Krishna" from here on out, even when talking about Claude's draft.

Back to the prose, we need to fix the issue where Krishna hands the card to Pemberton because, uh, his hands are full! C'mon Claude, it's like you've never held things in your human hands before!

108 is a sacred number in Hinduism, and Vaikuntha is the heavenly realm where Vishnu is said to reside. I was tickled by the idea of the card listing out the divine address as part of the general mashup.

I add adjectives to the script to help make it more concrete, switch "did not read" for "could not read" to clarify that he's not being lazy, and broke up the run-on sentence. "Silver salver" is a lovely noun phrase that runs the risk of being too striking, but I left it in as a treat.

The ant in the lotus is cute, but I ultimately decided it served no purpose in the story and should therefore be cut.

      else ops.push({ op: "ins", tok: B[j++] });
    }
    while (i < n) ops.push({ op: "del", tok: A[i++] });
    while (j < m) ops.push({ op: "ins", tok: B[j++] });
    for (let k = eb; k < b.length; k++) ops.push({ op: "eq", tok: b[k] });
    return ops;
  }

  // Group ops into equal / change segments and merge choppy bits so the
  // diff reads like "~~old phrase~~ new phrase" rather than confetti.
  function segment(ops) {
    const segs = [];
    for (const o of ops) {
      let last = segs[segs.length - 1];
      if (o.op === "eq") {
        if (!last || last.type !== "eq") segs.push(last = { type: "eq", toks: [] });
        last.toks.push(o.tok);
      } else {
        if (!last || last.type !== "chg") segs.push(last = { type: "chg", del: [], ins: [] });
        (o.op === "del" ? last.del : last.ins).push(o.tok);
      }
    }
    const len = ts => ts.reduce((n, t) => n + (t.k === "ws" ? 1 : t.t.length), 0);
    const size = g => Math.max(len(g.del), len(g.ins));
    for (let again = true; again;) {
      again = false;
      for (let k = 1; k < segs.length - 1; k++) {
        const p = segs[k - 1], e = segs[k], q = segs[k + 1];
        if (e.type !== "eq" || p.type !== "chg" || q.type !== "chg") continue;
        if (e.toks.some(t => t.k === "para")) continue;
        const trivial = e.toks.every(t => t.k === "ws" || t.k === "em");
        const small = len(e.toks) * 2 <= Math.min(size(p), size(q));
        if (trivial || small) {
          p.del.push(...e.toks, ...q.del);
          p.ins.push(...e.toks, ...q.ins);
          segs.splice(k, 2); again = true; break;
        }
      }
    }
    for (const g of segs) if (g.type === "chg") {
      g.pre = []; g.post = [];
      while (g.del.length && g.ins.length && g.del[0].key === g.ins[0].key) { g.pre.push(g.ins.shift()); g.del.shift(); }
      while (g.del.length && g.ins.length && g.del.at(-1).key === g.ins.at(-1).key) { g.post.unshift(g.ins.pop()); g.del.pop(); }
    }
    return segs;
  }

  /* ---------------- Rendering ---------------- */
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // stream: [{op:'eq'|'del'|'ins', tok}] -> HTML paragraphs.
  // Italics are tracked separately for Claude's text (cI) and Max's text (mI).
  function renderStream(stream) {
    let cI = false, mI = false, html = "<p>", runKey = null, buf = "";
    const flush = () => {
      if (buf) {
        const [op, it, fmt] = runKey.split("|");
        let inner = it === "1" ? `<em>${buf}</em>` : buf;
        if (fmt === "1") inner = `<span class="fmt" title="Formatting changed">${inner}</span>`;
        html += op === "del" ? `<del class="d">${inner}</del>` : op === "ins" ? `<ins class="i">${inner}</ins>` : inner;
      }
      buf = ""; runKey = null;
    };
    for (const { op, tok, soft } of stream) {
      if (tok.k === "em") { if (op !== "ins") cI = !cI; if (op !== "del") mI = !mI; continue; }
      if (tok.k === "para") {
        flush();
        if (op === "eq" || soft) html += "</p><p>";
        else if (op === "ins") html += '<ins class="pil" title="New paragraph">¶</ins></p><p>';
        else html += '<del class="pil" title="Paragraph break removed">¶</del> ';
        continue;
      }
      if (tok.t === "\u2042") { flush(); html += `<span class="scene ${op}" title="Scene break">⁂</span>`; continue; }
      const it = op === "del" ? cI : mI;
      const key = `${op}|${it ? 1 : 0}|${op === "eq" && cI !== mI ? 1 : 0}`;
      if (key !== runKey) { flush(); runKey = key; }
      buf += esc(tok.t);
    }
    flush();
    return (html + "</p>").replace(/<p>\s*<\/p>/g, "");
  }

  const isWord = t => t.k === "w" && /[\p{L}\p{N}]/u.test(t.t);
  const cache = [];
  function getRender(i) {
    if (cache[i]) return cache[i];
    const s = sections[i], a = tokenize(s.claude), b = tokenize(s.max);
    let stream = [], del = 0, ins = 0, same = 0;
    const eq = t => { stream.push({ op: "eq", tok: t }); if (isWord(t)) same++; };
    // A paragraph break inside a larger added/cut chunk is "soft": render it as a
    // plain break. Only an isolated added/removed break gets a ¶ marker.
    const push = (op, toks) => {
      const soft = toks.some(t => isWord(t) || t.t === "\u2042");
      toks.forEach(t => { stream.push({ op, tok: t, soft }); if (isWord(t)) op === "del" ? del++ : ins++; });
    };
    for (const g of segment(diffTokens(forDiff(a), forDiff(b)))) {
      if (g.type === "eq") { g.toks.forEach(eq); continue; }
      g.pre.forEach(eq); push("del", g.del); push("ins", g.ins); g.post.forEach(eq);
    }
    // Near-total rewrite: show it as one block out, one block in.
    const total = Math.max(a.filter(isWord).length, b.filter(isWord).length);
    if (a.length && b.length && total > 12 && same / total < 0.25) {
      stream = []; del = ins = 0;
      push("del", a);
      stream.push({ op: "ins", tok: { k: "para", t: "", key: "" }, soft: true });
      push("ins", b);
    }
    const plain = toks => renderStream(toks.map(t => ({ op: "eq", tok: t })));
    return (cache[i] = {
      claude: a.length ? plain(a) : '<p class="empty">Not in Claude’s draft — this passage is new.</p>',
      max: b.length ? plain(b) : '<p class="empty">Cut from the final version.</p>',
      edits: renderStream(stream),
      del, ins,
    });
  }

  // Light Markdown for notes (raw HTML passes through).
  function inline(s) {
    return s.replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
  }
  function md(src) {
    return src.replace(/\r\n?/g, "\n").trim().split(/\n[ \t]*\n/).map(block => {
      block = block.trim();
      if (!block) return "";
      if (/^<[a-z]/i.test(block)) return block;
      if (/^>/.test(block)) return `<blockquote>${inline(block.replace(/^>\s?/gm, ""))}</blockquote>`;
      if (/^[-*] /.test(block)) return "<ul>" + block.split(/\n(?=[-*] )/).map(li => `<li>${inline(li.replace(/^[-*] /, ""))}</li>`).join("") + "</ul>";
      return `<p>${inline(block)}</p>`;
    }).join("");
  }

  /* ---------------- State ---------------- */
  const TABS = [
    { id: "claude", name: "Claude", cap: "Claude Opus 4.7 · draft" },
    { id: "edits",  name: "Edits",  cap: "Changes" },
    { id: "max",    name: "Max",    cap: "Max · published" },
  ];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const state = { idx: null, tab: TABS.some(t => t.id === store.get("vh-tab")) ? store.get("vh-tab") : "edits" };

  const ARROW_L = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3M7 4 3 8l4 4"/></svg>';
  const ARROW_R = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
  const RESTART = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 3v3h3"/></svg>';

  function sectionHTML(i) {
    const s = sections[i], r = getRender(i);
    const panelBody = { claude: r.claude, edits: r.edits, max: r.max };
    const stats = `<span class="stats"><span class="minus">−${r.del}</span>&ensp;<span class="plus">+${r.ins}</span>&ensp;words</span>`;
    return `
      <div class="sec-head">
        <div class="sec-num">Passage <b>${i + 1}</b> of ${N}</div>
        ${s.label ? `<div class="sec-label">${inline(esc(s.label))}</div>` : ""}
      </div>
      <figure class="quote" data-tab="${state.tab}">
        <div class="tabs" role="tablist" aria-label="Version">
          ${TABS.map(t => `<button class="tab tab-${t.id}" role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}"
              aria-selected="${state.tab === t.id}" tabindex="${state.tab === t.id ? 0 : -1}" data-tab="${t.id}">${t.name}</button>`).join("")}
        </div>
        <div class="panels">
          ${TABS.map(t => `<div class="panel panel-${t.id}${state.tab === t.id ? " active" : ""}" role="tabpanel" id="panel-${t.id}" aria-labelledby="tab-${t.id}">
              <div class="panel-cap"><span>${t.cap}</span>${t.id === "edits" ? stats : ""}</div>
              <div class="txt">${panelBody[t.id]}</div>
            </div>`).join("")}
        </div>
      </figure>
      ${s.notes.trim() ? `<section class="notes"><div class="notes-label">Notes</div>${md(s.notes)}</section>` : ""}
      <nav class="pager" aria-label="Passage navigation">
        <button class="pill" data-go="${i === 0 ? "intro" : i - 1}">${ARROW_L}<span class="label">${i === 0 ? "Introduction" : "Previous"}</span></button>
        <span class="pos">${i + 1} / ${N}</span>
        ${i < N - 1
          ? `<button class="pill" data-go="${i + 1}"><span class="label">Next</span>${ARROW_R}</button>`
          : `<button class="pill" data-go="intro"><span class="label">Back to start</span>${RESTART}</button>`}
      </nav>`;
  }

  const view = document.getElementById("view");
  if (N > 40) document.documentElement.style.setProperty("--seg-gap", "1px");
  const progress = document.getElementById("progress");
  progress.innerHTML = sections.map((s, i) =>
    `<button data-go="${i}" aria-label="Go to passage ${i + 1}" title="${i + 1}${s.label ? " · " + esc(s.label) : ""}"></button>`).join("");

  function render(prev) {
    const i = state.idx;
    if (i < 0) {
      view.replaceChildren(document.getElementById("intro-tpl").content.cloneNode(true));
      view.querySelectorAll("[data-count]").forEach(el => el.textContent = N);
      document.title = "Vishnu Hadouken";
    } else {
      view.innerHTML = sectionHTML(i);
      document.title = `${i + 1}/${N} · Vishnu Hadouken`;
    }
    [...progress.children].forEach((b, k) => {
      b.classList.toggle("done", k < i);
      b.classList.toggle("cur", k === i);
      if (k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    if (prev !== null) {
      view.classList.remove("enter-r", "enter-l");
      void view.offsetWidth;
      view.classList.add(i > prev ? "enter-r" : "enter-l");
      window.scrollTo(0, 0);
    }
  }

  function setTab(id) {
    state.tab = id; store.set("vh-tab", id);
    const fig = view.querySelector(".quote");
    if (!fig) return;
    fig.dataset.tab = id;
    fig.querySelectorAll(".tab").forEach(t => {
      const on = t.dataset.tab === id;
      t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
    });
    fig.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + id));
  }

  /* ---------------- Routing (#intro, #1 … #N) ---------------- */
  function idxFromHash() {
    const m = location.hash.match(/^#(\d+)$/);
    const n = m ? +m[1] : 0;
    return n >= 1 && n <= N ? n - 1 : -1;
  }
  function go(idx) { location.hash = idx < 0 ? "intro" : String(idx + 1); }
  function sync() {
    const idx = idxFromHash();
    if (idx === state.idx) return;
    const prev = state.idx; state.idx = idx; render(prev);
  }
  window.addEventListener("hashchange", sync);
  const next = () => { if (state.idx < N - 1) go(state.idx + 1); };
  const prev = () => { if (state.idx >= 0) go(state.idx - 1); };

  document.addEventListener("click", e => {
    const tab = e.target.closest(".tab[data-tab]");
    if (tab) { setTab(tab.dataset.tab); return; }
    const nav = e.target.closest("[data-go]");
    if (nav) { e.preventDefault(); go(nav.dataset.go === "intro" ? -1 : +nav.dataset.go); }
  });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    else if (state.idx >= 0) {
      const t = { 1: "claude", 2: "edits", 3: "max", c: "claude", e: "edits", m: "max" }[e.key.toLowerCase()];
      if (t) setTab(t);
    }
  });
  // Swipe left/right on touch screens
  let tx = null, ty = null;
  view.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  view.addEventListener("touchend", e => {
    if (tx === null || String(getSelection())) { tx = null; return; }
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) dx < 0 ? next() : prev();
  }, { passive: true });

  sync();
})();
</script>
</body>
</html>
